<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AI Job Mission Control</title>
<style>:root{color-scheme:dark;--bg:#070914;--panel:#111526;--text:#f7f7fb;--muted:#9ba4bd;--line:#29314b;--pink:#ff66b3;--violet:#9d7cff;--green:#5ee0b5;--amber:#ffd166;--red:#ff7b8a}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 80% -10%,#432050 0,transparent 34%),radial-gradient(circle at -10% 25%,#17305b 0,transparent 30%),var(--bg);color:var(--text);font:15px/1.5 Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;min-height:100vh}button,input,select{font:inherit}.shell{max-width:1360px;margin:auto;padding:22px}.hidden{display:none!important}.card,.item{background:rgba(17,21,38,.94);border:1px solid var(--line);border-radius:18px;padding:18px}.login{max-width:440px;margin:12vh auto}.eyebrow{color:var(--green);font-weight:800;letter-spacing:.12em;font-size:11px}.login h1,.hero h1{margin:.4rem 0;font-size:clamp(30px,5vw,48px);line-height:1.05}.muted{color:var(--muted)}label{display:block;margin:15px 0 6px;font-weight:700}input,select{padding:11px 12px;border-radius:11px;border:1px solid var(--line);background:#080b17;color:var(--text)}input{width:100%}button{border:1px solid var(--line);background:#161b30;color:var(--text);padding:10px 13px;border-radius:11px;cursor:pointer}.primary,.tabs button.active,.seg button.active{background:linear-gradient(90deg,var(--pink),var(--violet));border-color:transparent;font-weight:800}.wide{width:100%;margin-top:18px}.error{color:var(--red);margin-top:12px}.success{color:var(--green);margin-top:12px}.top,.row,.sectionTitle,.toolbar,.filters,.seg{display:flex;align-items:center;gap:9px;flex-wrap:wrap}.top,.sectionTitle{justify-content:space-between}.brand{font-weight:900;font-size:20px}.hero{margin:16px 0;padding:24px;background:linear-gradient(135deg,#ffffff0c,#ffffff04);border:1px solid var(--line);border-radius:22px}.stats{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px;margin:14px 0}.stat{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:15px}.stat strong{display:block;font-size:27px}.stat span{color:var(--muted);font-size:12px}.tabs{display:flex;gap:8px;overflow:auto;padding:4px 0 12px}.toolbar{margin-bottom:12px}.toolbar input{max-width:360px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.item h3{margin:7px 0 3px}.tag{font-size:11px;border:1px solid var(--line);border-radius:999px;padding:4px 8px}.good{color:var(--green)}.warn{color:var(--amber)}.bad{color:var(--red)}.message{margin-top:12px;padding:12px;border:1px solid #36405f;background:#0a0f20;border-radius:12px;white-space:pre-wrap}.message small{display:block;color:var(--muted);margin-bottom:5px}.score{font-weight:900;color:var(--green)}.empty{text-align:center;color:var(--muted);padding:50px}.loading{position:fixed;inset:0;background:#070914dd;display:grid;place-items:center;z-index:10}.spinner{width:38px;height:38px;border:4px solid #ffffff20;border-top-color:var(--pink);border-radius:50%;animation:spin .8s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}a{color:#b9c7ff}.action{border-left:4px solid var(--violet)}.rank{font-size:24px;font-weight:900}.mini{font-size:12px}.nowrap{white-space:nowrap}@media(max-width:900px){.stats{grid-template-columns:repeat(2,1fr)}.grid{grid-template-columns:1fr}.shell{padding:12px}}</style></head>
<body><div id="loading" class="loading hidden"><div><div class="spinner"></div><p>Loading Mission Control…</p></div></div>
<main id="login" class="shell"><section class="card login"><div class="eyebrow">PRIVATE · AUTHENTICATED</div><h1>AI Job Mission Control</h1><p class="muted">Secure magic-link sign in.</p><form id="loginForm"><label for="email">Email</label><input id="email" type="email" value="sriupanya@gmail.com" required><button class="primary wide">Email me a sign-in link</button></form><div id="loginMessage"></div></section></main>
<main id="dashboard" class="shell hidden"><header class="top"><div class="brand">AI Job Mission Control ✦</div><div class="row"><span id="account" class="muted"></span><button id="refresh">Refresh everything</button><button id="signOut">Sign out</button></div></header><section class="hero"><div class="eyebrow">ACTION ENGINE · DAILY RESCORE</div><h1>Your career operating system.</h1><p class="muted">Roles, warm paths, tailored outreach, application history and today’s highest-value actions in one place.</p></section><section id="stats" class="stats"></section><nav id="tabs" class="tabs"></nav><section class="toolbar"><input id="search" type="search" placeholder="Search the current view…"><div id="filters" class="filters"></div></section><section id="content"></section></main>
<script type="module">
import{createClient}from"https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.95.0/+esm";import{SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY}from"./config.js";
const sb=createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY,{auth:{persistSession:true,detectSessionInUrl:true}}),state={data:null,tab:"Today",query:"",jobView:"toapply",peopleAction:"all",peopleStatus:"all",peopleCompany:"all",appStatus:"all"},el=id=>document.getElementById(id),esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])),terminal=new Set(["Rejected","Pass","Closed","Withdrawn"]),appliedSet=new Set(["Applied","Recruiter Screen","Interview","Offer"]),tabs=["Today","Jobs","Companies","People","Applications","Projects"],setLoading=o=>el("loading").classList.toggle("hidden",!o),showLogin=()=>{el("login").classList.remove("hidden");el("dashboard").classList.add("hidden")},showDashboard=()=>{el("login").classList.add("hidden");el("dashboard").classList.remove("hidden")},withTimeout=(p,m,l)=>Promise.race([p,new Promise((_,r)=>setTimeout(()=>r(new Error(l+" timed out.")),m))]);
async function loadCore(){setLoading(true);try{const{data:{session}}=await sb.auth.getSession();if(!session){showLogin();return}const r=await withTimeout(fetch(`${SUPABASE_URL}/functions/v1/mission-control-core-auth-v1`,{headers:{Authorization:`Bearer ${session.access_token}`,apikey:SUPABASE_PUBLISHABLE_KEY}}),20000,"Tracker load");if(r.status===401){await sb.auth.signOut();showLogin();throw new Error("Session expired. Please sign in again.")}if(!r.ok)throw new Error(`Core API HTTP ${r.status}`);const p=await r.json();state.data=p.data;el("account").textContent=session.user.email??"";showDashboard();render()}catch(e){showLogin();el("loginMessage").className="error";el("loginMessage").textContent=e.message}finally{setLoading(false)}}
el("loginForm").onsubmit=async e=>{e.preventDefault();setLoading(true);try{const email=el("email").value.trim(),redirectTo=`${window.location.origin}${window.location.pathname}`,{error}=await sb.auth.signInWithOtp({email,options:{emailRedirectTo:redirectTo,shouldCreateUser:false}});if(error)throw error;el("loginMessage").className="success";el("loginMessage").textContent=`Sign-in link sent to ${email}.`}catch(e){el("loginMessage").className="error";el("loginMessage").textContent=e.message}finally{setLoading(false)}};el("signOut").onclick=async()=>{await sb.auth.signOut();showLogin()};el("refresh").onclick=loadCore;el("search").oninput=e=>{state.query=e.target.value.toLowerCase();renderContent()};
const match=(...v)=>!state.query||v.some(x=>String(x??"").toLowerCase().includes(state.query)),tag=(t,c="")=>`<span class="tag ${c}">${esc(t)}</span>`,jobById=id=>state.data.jobs.find(j=>j.id===id),linksForContact=id=>state.data.contact_job_links.filter(x=>x.contact_id===id),activeJobs=()=>state.data.jobs.filter(j=>!terminal.has(j.status));
function jobCard(j){return`<article class="item"><div class="row">${tag(j.status,appliedSet.has(j.status)?"good":terminal.has(j.status)?"bad":"")}${j.h1b_status?tag("H-1B "+j.h1b_status,/strong|friendly|yes|transfer/i.test(j.h1b_status)?"good":"warn"):""}${j.action_score!=null?`<span class="score">${esc(j.action_score)} action</span>`:""}</div><h3>${esc(j.title)}</h3><div class="muted">${esc(j.company)} · ${esc(j.location)}</div><p>${esc(j.action_reason||j.selection_rationale||j.notes||"")}</p><div class="row"><b>${esc(j.fit_score??"—")}/10 fit</b>${j.job_req?tag(j.job_req):""}${j.apply_url?`<a href="${esc(j.apply_url)}" target="_blank" rel="noopener">Open role ↗</a>`:""}</div></article>`}
function actionCard(a){const j=a.job_id?jobById(a.job_id):null,c=a.contact_id?state.data.contacts.find(x=>x.id===a.contact_id):null;return`<article class="item action"><div class="row"><span class="rank">#${a.rank}</span>${tag(a.action_type,a.action_type==="Apply"?"good":"warn")}<span class="score">${esc(a.score)}</span></div><h3>${esc(a.title)}</h3><p>${esc(a.rationale||"")}</p>${a.message?`<div class="message"><small>Ready to send</small>${esc(a.message)}</div>`:""}<div class="row">${j?.apply_url?`<a href="${esc(j.apply_url)}" target="_blank">Open role ↗</a>`:""}${c?.linkedin_url?`<a href="${esc(c.linkedin_url)}" target="_blank">LinkedIn ↗</a>`:""}</div></article>`}
function personCard(p){const role=jobById(p.message_role_id),links=linksForContact(p.id),best=links.sort((a,b)=>Number(b.relevance_score||0)-Number(a.relevance_score||0))[0],msg=p.recommended_message||best?.connection_note||p.invite_note||"";return`<article class="item"><div class="row">${tag(p.status||"Not contacted")}${p.recommended_action?tag(p.recommended_action,p.recommended_action==="Connect"?"warn":"good"):""}${p.public_profile_verified?tag("Verified","good"):""}${p.network_score!=null?`<span class="score">${esc(p.network_score)}</span>`:""}</div><h3>${esc(p.name)}</h3><div class="muted">${esc(p.title)} · ${esc(p.company)}</div>${role?`<p><b>Best linked role:</b> ${esc(role.title)} · ${esc(role.status)}</p>`:""}<p>${esc(p.priority_reason||best?.relevance_reason||"")}</p>${msg?`<div class="message"><small>${p.recommended_action==="Connect"?`Connection note · ${msg.length}/300 chars`:`Tailored message for existing connection`}</small>${esc(msg)}</div>`:""}<div class="row">${p.linkedin_url?`<a href="${esc(p.linkedin_url)}" target="_blank" rel="noopener">LinkedIn ↗</a>`:""}</div></article>`}
function companyCard(c){const js=activeJobs().filter(j=>j.company===c.company),ps=state.data.contacts.filter(p=>p.company===c.company);return`<article class="item"><div class="row">${tag(c.priority_tier||"Target")}${tag("H-1B "+(c.h1b_confidence||"unknown"),/strong|high|friendly/i.test(c.h1b_confidence||"")?"good":"warn")}</div><h3>${esc(c.company)}</h3><p>${esc(c.h1b_evidence||c.notes||"")}</p><div class="row">${tag(js.length+" active roles")}${tag(ps.length+" people")}</div></article>`}
function projectCard(p){const n=state.data.project_job_links.filter(x=>x.project_id===p.id).length;return`<article class="item"><div class="row">${tag(p.status)}${p.verification_status?tag(p.verification_status,p.resume_eligible?"good":"warn"):""}${tag(n+" linked roles")}</div><h3>${esc(p.name)}</h3><p>${esc(p.description)}</p><div class="muted">${esc((p.skills||[]).join(" · "))}</div></article>`}
function select(id,label,values,current){return`<select id="${id}"><option value="all">${label}: All</option>${values.map(v=>`<option value="${esc(v)}" ${v===current?"selected":""}>${esc(v)}</option>`).join("")}</select>`}
function renderFilters(){const f=el("filters"),d=state.data;if(state.tab==="Jobs")f.innerHTML=`<div class="seg"><button data-jv="toapply" class="${state.jobView==="toapply"?"active":""}">To Apply</button><button data-jv="applied" class="${state.jobView==="applied"?"active":""}">Applied / In Process</button><button data-jv="all" class="${state.jobView==="all"?"active":""}">All Active</button></div>`;else if(state.tab==="People"){const statuses=[...new Set(d.contacts.map(x=>x.status).filter(Boolean))].sort(),companies=[...new Set(d.contacts.map(x=>x.company).filter(Boolean))].sort();f.innerHTML=`${select("pAction","Action",["Connect","Message existing connection","Await connection","Review relationship"],state.peopleAction)}${select("pStatus","Relationship",statuses,state.peopleStatus)}${select("pCompany","Company",companies,state.peopleCompany)}`;}else if(state.tab==="Applications"){const statuses=[...new Set(d.jobs.map(x=>x.status).filter(Boolean))].sort();f.innerHTML=select("aStatus","Status",statuses,state.appStatus)}else f.innerHTML="";f.querySelectorAll("[data-jv]").forEach(b=>b.onclick=()=>{state.jobView=b.dataset.jv;renderFilters();renderContent()});if(el("pAction"))el("pAction").onchange=e=>{state.peopleAction=e.target.value;renderContent()};if(el("pStatus"))el("pStatus").onchange=e=>{state.peopleStatus=e.target.value;renderContent()};if(el("pCompany"))el("pCompany").onchange=e=>{state.peopleCompany=e.target.value;renderContent()};if(el("aStatus"))el("aStatus").onchange=e=>{state.appStatus=e.target.value;renderContent()}}
function render(){const d=state.data,active=activeJobs(),applied=active.filter(j=>appliedSet.has(j.status)),todo=active.filter(j=>["Review","Saved"].includes(j.status)),network=d.contacts.filter(p=>["Connect","Message existing connection"].includes(p.recommended_action));el("stats").innerHTML=[["To apply",todo.length],["Applied / process",applied.length],["Today actions",d.daily_actions.length],["Network actions",network.length],["Companies",d.companies.length],["People",d.contacts.length]].map(([l,v])=>`<div class="stat"><strong>${v}</strong><span>${l}</span></div>`).join("");el("tabs").innerHTML=tabs.map(t=>`<button class="${state.tab===t?"active":""}" data-tab="${t}">${t}</button>`).join("");el("tabs").querySelectorAll("button").forEach(b=>b.onclick=()=>{state.tab=b.dataset.tab;state.query="";el("search").value="";renderFilters();renderContent()});renderFilters();renderContent()}
function renderContent(){const d=state.data;let title="",items=[];if(state.tab==="Today"){title=`Today’s action queue · scoring v${d.scoring_rules?.version||1}`;items=d.daily_actions.filter(a=>match(a.title,a.rationale,a.message)).map(actionCard)}if(state.tab==="Jobs"){title=state.jobView==="toapply"?"To Apply":state.jobView==="applied"?"Applied / In Process":"All Active Roles";let xs=activeJobs();if(state.jobView==="toapply")xs=xs.filter(j=>["Review","Saved"].includes(j.status));if(state.jobView==="applied")xs=xs.filter(j=>appliedSet.has(j.status));items=xs.filter(j=>match(j.company,j.title,j.location,j.status,j.job_req)).map(jobCard)}if(state.tab==="Companies"){title="Target companies";items=d.companies.filter(c=>match(c.company,c.category,c.priority_tier,c.h1b_confidence)).map(companyCard)}if(state.tab==="People"){title="People / warm paths";let xs=d.contacts;if(state.peopleAction!=="all")xs=xs.filter(p=>p.recommended_action===state.peopleAction);if(state.peopleStatus!=="all")xs=xs.filter(p=>p.status===state.peopleStatus);if(state.peopleCompany!=="all")xs=xs.filter(p=>p.company===state.peopleCompany);items=xs.filter(p=>match(p.name,p.company,p.title,p.status,p.recommended_action,p.recommended_message)).map(personCard)}if(state.tab==="Applications"){title="Application history";let xs=d.jobs.filter(j=>appliedSet.has(j.status)||terminal.has(j.status));if(state.appStatus!=="all")xs=xs.filter(j=>j.status===state.appStatus);items=xs.filter(j=>match(j.company,j.title,j.status,j.job_req)).map(jobCard)}if(state.tab==="Projects"){title="Project registry";items=d.personal_projects.filter(p=>match(p.name,p.description,p.status,(p.skills||[]).join(" "))).map(projectCard)}el("content").innerHTML=`<div class="sectionTitle"><h2>${title}</h2><span class="muted">${items.length} shown</span></div><div class="grid">${items.join("")}</div>${items.length?"":'<div class="empty">No matching items.</div>'}`}
sb.auth.onAuthStateChange((e,s)=>{if(s&&["SIGNED_IN","TOKEN_REFRESHED"].includes(e))setTimeout(loadCore,0)});const{data:{session}}=await sb.auth.getSession();if(session)await loadCore();else showLogin();
</script></body></html>
